<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas Pereira | Gestor de Marketing Digital e Especialista em Google Ads</title>
<meta name="description" content="Lucas Pereira de Oliveira Costa — Gestor de Marketing Digital especialista em Google Ads, inovação, aplicações, gerenciamento, dicas e aulas sobre investimento. Conselhos e melhores maneiras de investir.">
<meta name="keywords" content="Lucas Pereira, marketing digital, gestor de tráfego, Google Ads, inovação, aplicações, gerenciamento, dicas de investimento, aulas de investimento, melhores investimentos, consultoria">
<meta name="author" content="Lucas Pereira de Oliveira Costa">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0a0f1f">

<meta property="og:title" content="Lucas Pereira | Marketing Digital, Google Ads e Investimentos">
<meta property="og:description" content="Gestor de Marketing Digital especialista em Google Ads, inovação, gerenciamento, dicas e aulas sobre investimento.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Lucas Pereira">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ====================== VARIÁVEIS ====================== */
:root {
    --primary: #0a0f1f;
    --primary-2: #131a33;
    --primary-3: #1e2847;
    --accent: #00d4ff;
    --accent-2: #4ae3ff;
    --accent-dark: #00a8cc;
    --gold: #f5c542;
    --text: #1f2937;
    --text-mute: #6b7280;
    --bg: #f7f9fc;
    --bg-alt: #eef3f9;
    --white: #ffffff;
    --border: #e2e8f0;
    --success: #10b981;
    --shadow-sm: 0 1px 3px rgba(10,15,31,0.06);
    --shadow-md: 0 8px 24px rgba(10,15,31,0.08);
    --shadow-lg: 0 24px 48px rgba(10,15,31,0.14);
    --shadow-xl: 0 32px 64px rgba(10,15,31,0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; }

/* ====================== TOPBAR ====================== */
.topbar {
    background: var(--primary);
    color: #c9d3e6;
    font-size: 0.82rem;
    padding: 10px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
}
.topbar strong { color: #fff; font-weight: 600; }
.topbar a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
.topbar a:hover { text-decoration: underline; }
.topbar .dot { opacity: 0.4; }

/* ====================== NAVBAR ====================== */
.navbar {
    background: var(--white);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: var(--shadow-sm);
    border-bottom: 1px solid var(--border);
}
.nav-container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}
.brand-mark {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-weight: 900;
    font-size: 1.05rem;
    letter-spacing: -1px;
    box-shadow: 0 6px 14px rgba(10,15,31,0.25);
}
.brand-text { line-height: 1.15; }
.brand-text .name {
    font-weight: 800;
    font-size: 1.12rem;
    color: var(--primary);
    letter-spacing: -0.4px;
}
.brand-text .tag {
    font-size: 0.7rem;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 1.6px;
    font-weight: 600;
}

.nav-links {
    display: flex;
    gap: 26px;
    list-style: none;
    align-items: center;
}
.nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: color 0.2s;
    position: relative;
}
.nav-links a:hover { color: var(--accent-dark); }
.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 0;
    width: 0; height: 2px;
    background: var(--accent);
    transition: width 0.3s;
}
.nav-links a:hover::after { width: 100%; }

.nav-cta {
    background: var(--accent);
    color: var(--primary) !important;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.86rem;
    transition: all 0.25s !important;
}
.nav-cta:hover {
    background: var(--accent-2);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,212,255,0.4);
}
.nav-cta::after { display: none; }

/* ====================== HERO ====================== */
.hero {
    background:
        radial-gradient(circle at 15% 25%, rgba(0,212,255,0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0,212,255,0.10) 0%, transparent 45%),
        linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
    color: #fff;
    padding: 110px 24px 120px;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
}
.hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 2;
}
@media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; gap: 40px; }
    .hero { padding: 80px 20px 90px; }
}
.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,212,255,0.16);
    color: var(--accent-2);
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-bottom: 26px;
    border: 1px solid rgba(0,212,255,0.35);
}
.hero-badge::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(0,212,255,0.25);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.hero h1 {
    font-size: clamp(2rem, 4.5vw, 3.3rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1.2px;
    margin-bottom: 22px;
}
.hero h1 .hl { color: var(--accent-2); }
.hero p.lead {
    font-size: 1.08rem;
    color: #cbd5e1;
    max-width: 580px;
    margin-bottom: 40px;
    line-height: 1.75;
}
.hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 15px 30px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.25s;
    border: none;
    cursor: pointer;
    font-family: inherit;
}
.btn-primary {
    background: var(--accent);
    color: var(--primary);
    box-shadow: 0 10px 24px rgba(0,212,255,0.35);
}
.btn-primary:hover {
    background: var(--accent-2);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(0,212,255,0.5);
}
.btn-ghost {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.25);
}
.btn-ghost:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.06);
}
.hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 50px;
    padding-top: 34px;
    border-top: 1px solid rgba(255,255,255,0.12);
    max-width: 580px;
}
.hero-stat .num {
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--accent-2);
    letter-spacing: -1px;
    line-height: 1;
}
.hero-stat .lbl {
    font-size: 0.74rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-top: 8px;
    display: block;
}

/* Hero Card */
.hero-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 34px 32px;
    backdrop-filter: blur(10px);
}
.hero-card h3 {
    font-size: 0.76rem;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 700;
    margin-bottom: 20px;
}
.hero-card-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.hero-card-item:last-child { border-bottom: none; padding-bottom: 0; }
.hero-card-item .ico {
    width: 38px; height: 38px;
    background: rgba(0,212,255,0.16);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
}
.hero-card-item .k {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #94a3b8;
    font-weight: 600;
    margin-bottom: 3px;
}
.hero-card-item .v {
    color: #fff;
    font-weight: 600;
    font-size: 0.92rem;
    word-break: break-word;
}

/* ====================== STRIP ====================== */
.strip {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 24px 24px;
}
.strip-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
}
.strip-item {
    color: var(--text-mute);
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.strip-item::before {
    content: '◆';
    color: var(--accent);
    font-size: 0.7rem;
}

/* ====================== SEÇÃO BASE ====================== */
section.block { padding: 90px 24px; }
section.alt { background: var(--white); }
.container { max-width: 1200px; margin: 0 auto; }

.section-head {
    max-width: 800px;
    margin: 0 auto 60px;
    text-align: center;
}
.section-head .eyebrow {
    display: inline-block;
    color: var(--accent-dark);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.4px;
    font-size: 0.74rem;
    margin-bottom: 14px;
    padding: 6px 14px;
    background: rgba(0,212,255,0.12);
    border-radius: 50px;
}
.section-head h2 {
    font-size: clamp(1.75rem, 3.4vw, 2.4rem);
    color: var(--primary);
    letter-spacing: -0.8px;
    line-height: 1.18;
    margin-bottom: 16px;
    font-weight: 800;
}
.section-head p {
    color: var(--text-mute);
    font-size: 1.02rem;
    line-height: 1.75;
}

/* ====================== FEATURES ====================== */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 26px;
}
.feat {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 30px;
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
    position: relative;
    overflow: hidden;
}
.feat::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
}
.feat:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: transparent;
}
.feat:hover::before { transform: scaleX(1); }
.feat-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: var(--accent-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 22px;
    box-shadow: 0 10px 20px rgba(10,15,31,0.15);
}
.feat h3 {
    font-size: 1.06rem;
    color: var(--primary);
    margin-bottom: 10px;
    font-weight: 700;
}
.feat p {
    color: var(--text-mute);
    font-size: 0.92rem;
    line-height: 1.7;
}

/* ====================== SOBRE 2 COLUNAS ====================== */
.about-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}
@media (max-width: 900px) { .about-2col { grid-template-columns: 1fr; gap: 40px; } }
.about-2col h2 {
    font-size: clamp(1.7rem, 3.2vw, 2.2rem);
    color: var(--primary);
    letter-spacing: -0.6px;
    line-height: 1.2;
    margin-bottom: 22px;
    font-weight: 800;
}
.about-2col p {
    color: var(--text-mute);
    font-size: 1rem;
    line-height: 1.85;
    margin-bottom: 18px;
}
.about-list {
    list-style: none;
    margin-top: 26px;
}
.about-list li {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
    font-size: 0.95rem;
}
.about-list li:last-child { border-bottom: none; }
.about-list .check {
    width: 24px; height: 24px;
    background: rgba(16,185,129,0.12);
    color: var(--success);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 2px;
}
.about-visual {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-radius: 20px;
    padding: 44px 40px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-xl);
}
.about-visual::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(0,212,255,0.22), transparent 70%);
    border-radius: 50%;
}
.about-visual h3 {
    font-size: 1.15rem;
    margin-bottom: 26px;
    position: relative;
    font-weight: 700;
}
.about-visual .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: relative;
}
.about-visual .stat-row:last-child { border-bottom: none; }
.about-visual .stat-row .lbl {
    color: #94a3b8;
    font-size: 0.85rem;
    font-weight: 500;
}
.about-visual .stat-row .val {
    color: var(--accent-2);
    font-weight: 700;
    font-size: 0.95rem;
    text-align: right;
}

/* ====================== PRODUTOS ====================== */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
}
.prod {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 34px 28px;
    transition: all 0.3s;
    position: relative;
}
.prod:hover {
    background: var(--white);
    box-shadow: var(--shadow-lg);
    transform: translateY(-4px);
    border-color: rgba(0,212,255,0.4);
}
.prod-num {
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--accent-dark);
    letter-spacing: 2px;
    margin-bottom: 14px;
    display: block;
}
.prod h4 {
    color: var(--primary);
    font-size: 1.04rem;
    margin-bottom: 12px;
    font-weight: 700;
}
.prod p {
    color: var(--text-mute);
    font-size: 0.9rem;
    line-height: 1.7;
}

/* ====================== SERVIÇOS ====================== */
.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
}
.service {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 30px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}
.service::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0,212,255,0.10), transparent 70%);
    border-radius: 50%;
    transition: all 0.4s;
}
.service:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
}
.service:hover::after {
    width: 200px; height: 200px;
}
.service-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
}
.service h4 {
    color: var(--primary);
    font-size: 1.05rem;
    margin-bottom: 12px;
    font-weight: 700;
    position: relative;
    z-index: 1;
}
.service p {
    color: var(--text-mute);
    font-size: 0.92rem;
    line-height: 1.75;
    position: relative;
    z-index: 1;
}

/* ====================== DADOS CADASTRAIS ====================== */
.cadastro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}
@media (max-width: 860px) { .cadastro-grid { grid-template-columns: 1fr; } }

.cad-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s;
}
.cad-card:hover { box-shadow: var(--shadow-md); }
.cad-card h3 {
    font-size: 1.02rem;
    color: var(--primary);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
}
.cad-card h3 .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
}
.data-list { list-style: none; }
.data-list li {
    padding: 15px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}
.data-list li:last-child { border-bottom: none; }
.data-list .label {
    color: var(--text-mute);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    flex-shrink: 0;
}
.data-list .value {
    color: var(--primary);
    font-weight: 600;
    text-align: right;
    font-size: 0.93rem;
    word-break: break-word;
}
.badge-active {
    background: rgba(16,185,129,0.12);
    color: var(--success);
    padding: 3px 12px;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}

.compliance {
    margin-top: 40px;
    padding: 28px 32px;
    background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
    border-left: 5px solid var(--success);
    border-radius: 12px;
    display: flex;
    gap: 22px;
    align-items: flex-start;
    box-shadow: var(--shadow-sm);
}
.compliance .shield {
    font-size: 2rem;
    flex-shrink: 0;
    line-height: 1;
}
.compliance strong {
    display: block;
    color: var(--primary);
    margin-bottom: 6px;
    font-size: 1.02rem;
    font-weight: 700;
}
.compliance p {
    color: #4b5563;
    font-size: 0.92rem;
    line-height: 1.7;
}

/* ====================== DEPOIMENTOS ====================== */
.depo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
}
.depo {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 34px 30px;
    transition: all 0.3s;
    position: relative;
}
.depo:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
}
.depo .quote-mark {
    font-size: 3rem;
    color: var(--accent);
    line-height: 0.6;
    font-weight: 900;
    margin-bottom: 18px;
    opacity: 0.4;
}
.depo p {
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.8;
    margin-bottom: 22px;
    font-style: italic;
}
.depo .author {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}
.depo .avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: var(--accent-2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.95rem;
    flex-shrink: 0;
}
.depo .author-info .name {
    font-weight: 700;
    color: var(--primary);
    font-size: 0.92rem;
    display: block;
}
.depo .author-info .role {
    color: var(--text-mute);
    font-size: 0.8rem;
}

/* ====================== FAQ ====================== */
.faq-wrap { max-width: 880px; margin: 0 auto; }
.faq-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.25s;
}
.faq-item[open] {
    background: var(--white);
    border-color: rgba(0,212,255,0.4);
    box-shadow: var(--shadow-md);
}
.faq-item summary {
    padding: 22px 28px;
    cursor: pointer;
    font-weight: 600;
    color: var(--primary);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    font-size: 0.98rem;
    transition: color 0.2s;
}
.faq-item summary:hover { color: var(--accent-dark); }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after {
    content: '+';
    font-size: 1.5rem;
    color: var(--accent);
    font-weight: 300;
    flex-shrink: 0;
    transition: transform 0.3s;
    line-height: 1;
}
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-item .faq-content {
    padding: 0 28px 24px;
    color: var(--text-mute);
    font-size: 0.93rem;
    line-height: 1.8;
}
